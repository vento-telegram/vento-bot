services:
  bot:
    container_name: bot
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: sh -c "alembic upgrade head && python cli.py start"
    volumes:
      - ./src:/bot/code
    depends_on:
      - db
      - redis

  admin-bot:
    container_name: admin-bot
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Run only the admin bot. Migrations run in 'bot' service.
    command: sh -c "python cli.py start-admin"
    volumes:
      - ./src:/bot/code
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=vento
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vento
    volumes:
      - vento_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "8202:6379"
    volumes:
      - redis_data:/data

volumes:
  vento_db:
  redis_data:
